<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Quiz Answers</title>
    <script src="config.js"></script>
    <style>
      :root {
        --bg: #1a1520;
        --panel: #241c2c;
        --line: #3d3248;
        --text: #f4eef8;
        --muted: #b9a9c8;
        --ok: #3ecf8e;
        --bad: #f07178;
        --accent: #e8a0bf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Georgia, serif;
        background: radial-gradient(1200px 600px at 10% -10%, #3a2748, transparent),
          radial-gradient(900px 500px at 100% 0%, #2a1f35, transparent), var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 28px 18px 48px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .meta {
        color: var(--muted);
        margin-bottom: 22px;
        font-size: 0.95rem;
      }
      .status {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        margin-bottom: 18px;
      }
      .status.error {
        border-color: #7a3040;
        color: #ffb4ba;
      }
      .session {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel) 92%, black);
        margin-bottom: 18px;
        overflow: hidden;
      }
      .session-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        justify-content: space-between;
        align-items: baseline;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 70%, #000);
      }
      .session-head strong {
        color: var(--accent);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.85rem;
        word-break: break-all;
      }
      .session-head span {
        color: var(--muted);
        font-size: 0.85rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(0, 0, 0, 0.18);
      }
      tr:last-child td {
        border-bottom: none;
      }
      .qid {
        font-family: ui-monospace, Consolas, monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      .qtext {
        max-width: 280px;
      }
      .opt {
        font-family: ui-monospace, Consolas, monospace;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
      }
      .pill.ok {
        background: rgba(62, 207, 142, 0.18);
        color: var(--ok);
      }
      .pill.bad {
        background: rgba(240, 113, 120, 0.18);
        color: var(--bad);
      }
      .pill.na {
        background: rgba(185, 169, 200, 0.15);
        color: var(--muted);
      }
      .type {
        text-transform: capitalize;
        color: var(--muted);
        white-space: nowrap;
      }
      .time {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
      }
      @media (max-width: 800px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }
        thead {
          display: none;
        }
        tr {
          padding: 12px;
          border-bottom: 1px solid var(--line);
        }
        td {
          border: none;
          padding: 4px 0;
        }
        td::before {
          content: attr(data-label);
          display: block;
          color: var(--muted);
          font-size: 0.72rem;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          margin-bottom: 2px;
        }
        .qtext {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Submitted Quiz Answers</h1>
      <p class="meta" id="summary">Loading…</p>
      <div id="status" class="status" hidden></div>
      <div id="sessions"></div>
    </div>
    <script>
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmt(iso) {
        if (!iso) return "—";
        try {
          const d = new Date(iso);
          if (Number.isNaN(d.getTime())) return esc(iso);
          return d.toLocaleString(undefined, {
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true,
          });
        } catch {
          return esc(iso);
        }
      }

      function correctnessCell(a) {
        if (a.questionType === "personality") {
          return '<span class="pill na">n/a</span>';
        }
        if (a.isCorrect === true) return '<span class="pill ok">true</span>';
        if (a.isCorrect === false) return '<span class="pill bad">false</span>';
        return '<span class="pill na">—</span>';
      }

      function displayedCell(v) {
        if (v === "Correct") return '<span class="pill ok">Correct</span>';
        if (v === "Incorrect") return '<span class="pill bad">Incorrect</span>';
        return esc(v);
      }

      function renderSessions(sessions, total) {
        const root = document.getElementById("sessions");
        const summary = document.getElementById("summary");
        summary.textContent = `${total} answer${total === 1 ? "" : "s"} across ${
          sessions.length
        } session${sessions.length === 1 ? "" : "s"}`;

        if (!sessions.length) {
          root.innerHTML =
            '<div class="status">No answers submitted yet.</div>';
          return;
        }

        root.innerHTML = sessions
          .map((s) => {
            const rows = (s.answers || [])
              .map(
                (a) => `
              <tr>
                <td data-label="Question" class="qid">${esc(a.questionId)}</td>
                <td data-label="Round">${esc(a.round || "—")}</td>
                <td data-label="Question text" class="qtext">${esc(
                  a.questionText
                )}</td>
                <td data-label="Selected" class="opt"><strong>${esc(
                  a.selectedOption
                )}</strong>. ${esc(a.selectedText)}</td>
                <td data-label="Type" class="type">${esc(a.questionType)}</td>
                <td data-label="Actual correct">${correctnessCell(a)}</td>
                <td data-label="Displayed">${displayedCell(
                  a.displayedResult
                )}</td>
                <td data-label="Server time" class="time">${fmt(
                  a.answeredAt
                )}</td>
                <td data-label="Client time" class="time">${fmt(
                  a.clientAnsweredAt
                )}</td>
              </tr>`
              )
              .join("");

            return `
            <section class="session">
              <div class="session-head">
                <strong>Session ${esc(s.sessionId)}</strong>
                <span>${(s.answers || []).length} selection${
              (s.answers || []).length === 1 ? "" : "s"
            } · latest ${fmt(s.latestAt)}</span>
              </div>
              <div style="overflow-x:auto">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Round</th>
                      <th>Question</th>
                      <th>Selected</th>
                      <th>Type</th>
                      <th>Actual</th>
                      <th>Displayed</th>
                      <th>Server timestamp</th>
                      <th>Client timestamp</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </section>`;
          })
          .join("");
      }

      async function load() {
        const status = document.getElementById("status");
        try {
          const apiBase = String(window.NANHA_API_BASE || "").replace(/\/$/, "");
          const res = await fetch(`${apiBase}/api/quiz/answers`, {
            credentials: "include",
          });
          let payload = null;
          try {
            payload = await res.json();
          } catch (_) {}
          if (!res.ok) {
            const msg = payload?.error || `HTTP ${res.status}`;
            const e = new Error(msg);
            e.bodyError = msg;
            throw e;
          }
          status.hidden = true;
          renderSessions(payload.sessions || [], payload.total || 0);
        } catch (err) {
          status.hidden = false;
          status.className = "status error";
          const detail = err?.bodyError || err?.message || "";
          status.textContent =
            "Could not load answers. Make sure the Nanha Cloud server is running (npm start in server/) and MongoDB is connected. " +
            detail;
          document.getElementById("summary").textContent = "Failed to load";
        }
      }

      load();
    </script>
  </body>
</html>
