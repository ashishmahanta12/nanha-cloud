<style>
  /* Layout: one centered button; the two eyes sit above the "Yes" label inside it. */
  :root {
    --bg: #f4eef2;
    --fg: #3a2a3a;
    --muted: #7d6a7a;
    --focus: #2b6ad8;
    --btn-a: #ff9468;
    --btn-b: #f2507a;
    --btn-c: #d9387f;
    --btn-shadow: rgba(217, 56, 127, 0.38);
    --font-display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17111a; --fg: #f3e7ef; --muted: #a692a3; --focus: #8fb6ff;
      --btn-shadow: rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17111a; --fg: #f3e7ef; --muted: #a692a3; --focus: #8fb6ff;
    --btn-shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    box-sizing: border-box;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 24px; min-width: 0; }

  .yes {
    appearance: none;
    border: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 30px clamp(24px, 8vw, 44px) 22px;
    border-radius: 44px;
    color: #fff;
    background: linear-gradient(160deg, var(--btn-a) 0%, var(--btn-b) 55%, var(--btn-c) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.35),
      inset 0 -6px 14px rgba(120, 10, 70, 0.18),
      0 18px 36px -10px var(--btn-shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: manipulation;
  }
  .yes:hover { transform: translateY(-2px); }
  .yes:active { transform: translateY(1px) scale(0.985); }
  .yes:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  .eyes { display: flex; gap: clamp(16px, 6vw, 36px); }
  .eye { width: clamp(88px, 27vw, 122px); height: auto; display: block; overflow: visible; }
  .art { transform-box: view-box; transform-origin: 64px 74px; }
  .yes.blink .art { animation: blink 0.26s ease-in-out; }
  @keyframes blink { 0%, 100% { transform: scaleY(1); } 45% { transform: scaleY(0.08); } }

  .label {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 2.5rem);
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 6px rgba(120, 10, 70, 0.35);
  }

  .hint { margin: 0; font-size: 0.875rem; line-height: 1.5; color: var(--muted); text-align: center; max-width: 30ch; text-wrap: balance; }

  @media (prefers-reduced-motion: reduce) {
    .yes, .yes:hover, .yes:active { transition: none; }
    .yes.blink .art { animation: none; }
  }
</style>

<script>
(function () {
  var btn = document.getElementById('yes');
  var MAX = 11;          // max pupil travel in SVG units; keeps the pupil well inside the iris (r = 36)
  var DETAIL = 0.45;     // iris glow shifts less than the pupil for a little depth
  var FALLOFF = 110;     // px distance at which the pupil reaches full travel
  var YSCALE = 0.85;     // vertical travel is a touch shorter, like a real eye
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var eyes = Array.prototype.map.call(btn.querySelectorAll('.eye'), function (svg) {
    return {
      svg: svg, flip: Number(svg.dataset.flip) || 1, iris: svg.querySelector('.iris'), pupil: svg.querySelector('.pupil'), detail: svg.querySelector('.detail'),
      x: 0, y: 0, tx: 0, ty: 0, cx: 0, cy: 0
    };
  });

  var px = 0, py = 0, active = false, dirty = true, running = false, last = 0, releaseTimer = 0;

  function measure() {
    eyes.forEach(function (e) {
      var r = e.iris.getBoundingClientRect();
      e.cx = r.left + r.width * 0.5;
      e.cy = r.top + r.height * 0.5;
    });
  }

  function aim() {
    eyes.forEach(function (e) {
      if (!active) { e.tx = 0; e.ty = 0; return; }
      var dx = px - e.cx, dy = py - e.cy;
      var d = Math.hypot(dx, dy) || 1;
      var s = Math.min(1, d / FALLOFF);
      s = s * (2 - s);                        // ease-out so small cursor moves still read
      var r = MAX * s;
      e.tx = (dx / d) * r;
      e.ty = (dy / d) * r * YSCALE;
    });
  }

  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0.016);
    last = t;
    if (dirty) { measure(); dirty = false; }
    aim();
    var k = reduce.matches ? 40 : (active ? 13 : 7);
    var a = 1 - Math.exp(-k * dt);            // frame-rate independent easing
    var moving = false;
    eyes.forEach(function (e) {
      e.x += (e.tx - e.x) * a;
      e.y += (e.ty - e.y) * a;
      if (Math.abs(e.tx - e.x) < 0.01 && Math.abs(e.ty - e.y) < 0.01) { e.x = e.tx; e.y = e.ty; }
      else moving = true;
      e.pupil.setAttribute('transform', 'translate(' + (e.x * e.flip).toFixed(2) + ' ' + e.y.toFixed(2) + ')');
      e.detail.setAttribute('transform', 'translate(' + (e.x * e.flip * DETAIL).toFixed(2) + ' ' + (e.y * DETAIL).toFixed(2) + ')');
    });
    if (moving) requestAnimationFrame(frame); else running = false;
  }

  function kick() {
    if (running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  function release() { active = false; kick(); }

  btn.addEventListener('pointerenter', function (e) {
    clearTimeout(releaseTimer);
    active = true; dirty = true; px = e.clientX; py = e.clientY; kick();
  });
  btn.addEventListener('pointermove', function (e) {
    clearTimeout(releaseTimer);
    active = true; px = e.clientX; py = e.clientY; kick();
  });
  btn.addEventListener('pointerleave', function (e) {
    clearTimeout(releaseTimer);
    if (e.pointerType === 'touch') releaseTimer = setTimeout(release, 650);  // let a tap's gaze linger
    else release();
  });
  btn.addEventListener('pointercancel', release);

  btn.addEventListener('click', function () {
    btn.classList.remove('blink');
    void btn.offsetWidth;
    btn.classList.add('blink');
  });
  btn.addEventListener('animationend', function () { btn.classList.remove('blink'); });

  function invalidate() { dirty = true; if (active) kick(); }
  window.addEventListener('resize', invalidate);
  window.addEventListener('scroll', invalidate, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(invalidate).observe(btn);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(invalidate);
})();
</script>
